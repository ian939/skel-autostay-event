<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<!-- 웹뷰 전용: 사용자 확대를 막아 앱 화면처럼 동작하게 한다 -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>참여 지점 찾기</title>
<meta name="format-detection" content="telephone=no">
<link rel="icon" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA2NCA2NCI+CiAgPHJlY3Qgd2lkdGg9IjY0IiBoZWlnaHQ9IjY0IiByeD0iMTQiIGZpbGw9IiMwMDcxRTMiLz4KICA8cGF0aCBkPSJNMzIgMTNjMCAwLTEzIDE1LjUtMTMgMjQuMkExMyAxMyAwIDAgMCA0NSAzNy4yQzQ1IDI4LjUgMzIgMTMgMzIgMTN6IiBmaWxsPSIjZmZmIi8+Cjwvc3ZnPg==" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* 오토스테이 참여 지점 찾기 — 스타일 (모바일 우선) */

:root {
  --blue: #0066CC;   /* 강조 헤드라인 · 숫자 */
  --cta:  #0071E3;   /* 버튼 */
  --ink:  #1D1D1F;
  --ink2: #6E6E73;
  --ink3: #86868B;
  --card: #F5F5F7;
  --line: #E5E5EA;
  --red:  #E72026;   /* 로고 + 직영 핀 (데이터 인코딩) 한정 */
  --r-sm: 12px;
  --r-md: 16px;
  --r-lg: 20px;
}

* { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  font-family: "Noto Sans KR", -apple-system, BlinkMacSystemFont,
               "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  color: var(--ink);
  background: #fff;
  -webkit-font-smoothing: antialiased;
  letter-spacing: -0.02em;
  line-height: 1.5;
}

a { color: var(--blue); text-decoration: none; }
a:hover { color: #004E9E; }
h1, h2, h3 { margin: 0; letter-spacing: -0.03em; }
p, ul, ol { margin: 0; }
ul, ol { padding: 0; list-style: none; }

.sr-only {
  position: absolute; width: 1px; height: 1px;
  padding: 0; margin: -1px; overflow: hidden;
  clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

.wrap { max-width: 720px; margin: 0 auto; padding: 0 24px; }
section { padding: 52px 0; }
.muted { color: var(--ink3); }
.accent { color: var(--blue); }

/* 미확정 플레이스홀더 — 배포 전 이 규칙과 .todo 마크업을 제거한다 */
.todo {
  background: #FFF3CD;
  color: #8A6D3B;
  padding: 0 4px;
  border-radius: 4px;
  font-weight: 700;
  white-space: nowrap;
}

.eyebrow {
  font-size: 14px; font-weight: 700; color: var(--blue);
  margin-bottom: 12px;
}
.eyebrow--dark { color: var(--cta); }

.sec__title { font-size: 28px; font-weight: 900; line-height: 1.28; }
.sec__lead { margin-top: 14px; font-size: 15px; line-height: 1.65; color: var(--ink2); }
.sec__body { margin-top: 18px; font-size: 15px; line-height: 1.8; color: var(--ink2); }
.sec__body strong { color: var(--ink); font-weight: 700; }

/* ── 버튼 ─────────────────────────────── */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 48px; padding: 0 26px;
  border: 0; border-radius: 999px;
  font-family: inherit; font-size: 16px; font-weight: 700;
  letter-spacing: -0.02em; cursor: pointer;
  text-decoration: none;
}
.btn--primary { background: var(--cta); color: #fff; }
.btn--primary:hover { background: #0063C6; color: #fff; }
.btn--dark { background: var(--ink); color: #fff; }
.btn--dark:hover { background: #000; color: #fff; }
.btn--ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
.btn--lg { min-height: 54px; padding: 0 36px; }
.btn:disabled { opacity: .55; cursor: default; }
.ico { width: 20px; height: 20px; flex-shrink: 0; }

/* ── 히어로 ─────────────────────────────── */
.hero { padding: 44px 0 48px; text-align: center; }
.hero__title { font-size: 34px; font-weight: 900; line-height: 1.22; }
.hero__lead { margin-top: 18px; font-size: 15px; line-height: 1.68; color: var(--ink2); }
.hero__lead strong { color: var(--ink); font-weight: 700; }
.hero__period { margin: 20px 0 16px; font-size: 14px; color: var(--ink3); }

.offer-chips {
  display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
  margin-top: 22px;
}
.offer-chips li {
  padding: 20px 14px; background: var(--card); border-radius: var(--r-md);
}
.offer-chips__label {
  display: block; font-size: 12px; font-weight: 500;
  color: var(--ink3); margin-bottom: 8px;
}
.offer-chips strong { font-size: 38px; font-weight: 900; letter-spacing: -0.04em; }
.offer-chips em { font-size: 19px; font-style: normal; color: var(--ink3); }
.offer-chips .accent em { color: var(--blue); }

.lockup {
  display: flex; align-items: center; justify-content: center; gap: 14px;
  margin-top: 30px;
}
.lockup__as {
  display: inline-flex; align-items: center; height: 28px; padding: 0 10px;
  background: var(--red); color: #fff; border-radius: 3px;
  font-size: 15px; font-weight: 900; font-style: italic; letter-spacing: -0.02em;
}
.lockup__x { font-size: 12px; color: var(--ink3); }
.lockup__skel { font-size: 16px; }
.lockup__skel b { font-size: 17px; font-weight: 900; letter-spacing: -0.02em; }

/* ── 기준점 입력 ─────────────────────────── */
.origin-bar { display: flex; flex-direction: column; gap: 10px; margin-top: 26px; }
.btn--locate { width: 100%; }

.search { display: flex; align-items: center; gap: 8px;
  padding: 0 8px 0 18px; background: var(--card);
  border: 1px solid transparent; border-radius: 999px; }
.search:focus-within { background: #fff; border-color: var(--blue); }
.search input {
  flex: 1 1 auto; min-width: 0; height: 48px;
  border: 0; background: transparent; outline: none;
  font-family: inherit; font-size: 16px; color: var(--ink);
  letter-spacing: -0.02em;
}
.search input::placeholder { color: var(--ink3); }
.search input::-webkit-search-cancel-button { -webkit-appearance: none; }
.search__btn {
  display: flex; align-items: center; justify-content: center;
  width: 44px; height: 44px; flex-shrink: 0;
  border: 0; border-radius: 50%; background: transparent;
  color: var(--ink2); cursor: pointer;
}
.search__btn:hover { color: var(--blue); }

.status { margin-top: 12px; font-size: 13px; line-height: 1.6; white-space: pre-line; }
.status.is-err  { color: #C0392B; }
.status.is-warn { color: #8A6D3B; }
.status.is-ok   { color: var(--ink2); }

.candidates {
  margin-top: 10px; border: 1px solid var(--line);
  border-radius: var(--r-sm); overflow: hidden;
}
.candidates li + li { border-top: 1px solid var(--line); }
.candidates button {
  display: block; width: 100%; padding: 13px 16px;
  border: 0; background: #fff; text-align: left; cursor: pointer;
  font-family: inherit; font-size: 14px; color: var(--ink);
}
.candidates button:hover { background: var(--card); }
.candidates b { display: block; font-weight: 700; }
.candidates span { display: block; margin-top: 3px; font-size: 12px; color: var(--ink3); }

/* ── 추천 카드 ─────────────────────────── */
.recommend {
  margin-top: 18px; padding: 22px 20px;
  background: var(--ink); color: #fff; border-radius: var(--r-lg);
}
.recommend__tag { font-size: 12px; font-weight: 700; color: var(--cta); }
.recommend__name { margin-top: 8px; font-size: 20px; font-weight: 900; letter-spacing: -0.03em; }
.recommend__meta { margin-top: 8px; font-size: 13px; color: #A1A1A6; }
.recommend__dist {
  display: inline-flex; align-items: baseline; gap: 4px;
  margin-top: 12px; font-size: 15px; font-weight: 700;
}
.recommend__dist b { font-size: 26px; font-weight: 900; letter-spacing: -0.03em; }
.recommend__note { margin-top: 6px; font-size: 12px; line-height: 1.5; color: #86868B; }
.recommend__acts { display: flex; gap: 8px; margin-top: 14px; }
.recommend__acts .btn { flex: 1 1 0; min-height: 44px; padding: 0 14px; font-size: 14px; }
.recommend__acts .btn--ghost { color: #fff; border-color: #48484A; }

/* ── 지역 필터 칩 ───────────────────────── */
.chips {
  display: flex; gap: 8px; margin-top: 22px;
  overflow-x: auto; scroll-snap-type: x proximity;
  padding-bottom: 4px; scrollbar-width: none;
  /* 래퍼 좌우 패딩을 상쇄해 칩이 화면 끝까지 흐르게 한다.
     그렇지 않으면 마지막 칩이 잘린 채 멈춰 스크롤 가능함이 드러나지 않는다. */
  margin-left: -24px; margin-right: -24px;
  padding-left: 24px; padding-right: 24px;
  -webkit-overflow-scrolling: touch;
}
.chips::-webkit-scrollbar { display: none; }
.chips button {
  flex: 0 0 auto; scroll-snap-align: start;
  min-height: 44px; padding: 0 18px;
  border: 1px solid var(--line); border-radius: 999px;
  background: #fff; color: var(--ink2);
  font-family: inherit; font-size: 14px; font-weight: 700;
  letter-spacing: -0.02em; cursor: pointer;
}
.chips button[aria-selected="true"] {
  background: var(--ink); border-color: var(--ink); color: #fff;
}

/* ── 지도 + 리스트 ──────────────────────── */
.finder-section { padding-bottom: 0; }
.finder { margin-top: 16px; }
/* 모바일에서 지도까지의 거리를 줄인다 — 설명문은 짧게, 여백은 촘촘히 */
.finder-section .sec__lead { margin-top: 10px; font-size: 14px; }
.finder-section .origin-bar { margin-top: 18px; }
.finder-section .chips { margin-top: 16px; }
.recommend { margin-top: 14px; padding: 18px 18px 16px; }

/* 모바일: 지도를 리스트 전체 구간에서 상단에 고정한다.
   sticky는 "부모 박스 안에서만" 붙어 있으므로, 지도만 sticky로 두면
   .map-col 높이(=지도 높이)를 벗어나는 즉시 떨어져 나간다.
   그래서 .map-col을 sticky로 만들고, 형제인 .list-col이 그 아래를 흐르게 한다. */
.map-col {
  position: sticky; top: 0; z-index: 3;
  background: #fff;
  box-shadow: 0 6px 16px -10px rgba(0,0,0,.35);
}
.map {
  width: 100%;
  height: 42vh;   /* 구형 브라우저 폴백 */
  height: 42svh;  /* 모바일 툴바로 인한 레이아웃 점프 방지 */
  min-height: 260px; max-height: 380px;
  background: var(--card);
  /* 한 손가락 드래그를 지도 이동에 쓴다.
     기본값(auto)이면 브라우저가 드래그를 페이지 스크롤로 먼저 가져가
     지도 안에서 위치 조정이 되지 않는다. none으로 두면 카카오가
     터치를 직접 처리한다(핀치 줌 포함). 페이지 스크롤은 지도 밖에서 한다. */
  touch-action: none;
}
.map-fallback {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 14px; height: 100%; padding: 24px; text-align: center;
}
.map-fallback p { font-size: 14px; line-height: 1.6; color: var(--ink2); }

.legend {
  display: flex; gap: 14px;
  padding: 10px 24px 11px; background: #fff;
  border-bottom: 1px solid var(--line);
  font-size: 12px; color: var(--ink2);
  position: relative;
}
/* 고정된 지도 아래로 리스트가 지나가며 행이 잘려 보이는 것을 완화하는 페이드 */
.legend::after {
  content: ""; position: absolute; left: 0; right: 0; top: 100%;
  height: 14px; pointer-events: none;
  background: linear-gradient(#fff, rgba(255,255,255,0));
}
.legend li { display: flex; align-items: center; gap: 6px; }
.dot { width: 9px; height: 9px; border-radius: 50%; }
.dot--direct { background: var(--red); }
.dot--fr { background: var(--blue); }
body.no-map .map, body.no-map .legend { position: static; }

.list-col { padding: 0 24px 40px; }
.list-head {
  display: flex; align-items: baseline; justify-content: space-between;
  padding: 20px 0 14px;
}
.list-head h3 { font-size: 17px; font-weight: 900; }
.list-head span { font-size: 12px; }

.store-list { display: flex; flex-direction: column; gap: 8px; }
.store-item {
  display: grid;
  grid-template-columns: 1fr auto;
  grid-template-areas: "top act" "addr act";
  align-items: center; column-gap: 12px; row-gap: 5px;
  width: 100%; padding: 14px 16px; text-align: left;
  background: var(--card); border: 1px solid transparent;
  border-radius: var(--r-md); cursor: pointer;
  font-family: inherit; color: inherit;
  -webkit-tap-highlight-color: transparent;
}
.store-item__top  { grid-area: top; }
.store-item__addr { grid-area: addr; }
.store-item__foot { grid-area: act; }
.store-item:hover { background: #EFEFF2; }
.store-item.is-selected { background: #fff; border-color: var(--ink); }
.store-item__top {
  display: flex; align-items: center; gap: 7px;
  flex-wrap: nowrap; min-width: 0;   /* 거리 배지가 줄바꿈되어 행이 커지는 것 방지 */
}
.store-item__name {
  font-size: 16px; font-weight: 700;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.store-item .badge { flex-shrink: 0; }
.badge {
  display: inline-flex; align-items: center; height: 22px; padding: 0 8px;
  border-radius: 5px; font-size: 12px; font-weight: 700;
}
.badge--direct { background: #FDEEEE; color: var(--red); }
.badge--fr { background: #EAF2FC; color: var(--blue); }
.badge--dist { background: var(--ink); color: #fff; }
.store-item__addr { font-size: 13px; line-height: 1.45; color: var(--ink3); }
.store-item__foot { display: flex; align-items: center; }
.store-item__hours { display: none; }   /* 영업시간은 주소 줄에 병기 (행 높이 절감) */
.store-item__addr .hours { color: var(--ink2); font-weight: 500; }
.store-item__link {
  display: inline-flex; align-items: center; justify-content: center;
  min-height: 44px; padding: 0 18px;   /* 모바일 최소 탭 타깃 44px */
  background: #fff; border: 1px solid var(--line); border-radius: 999px;
  font-size: 14px; font-weight: 700; color: var(--blue);
}
.store-item.is-selected .store-item__link { background: var(--card); }

.empty { padding: 32px 8px; text-align: center; font-size: 14px;
  line-height: 1.7; color: var(--ink3); white-space: pre-line; }
.note { margin-top: 14px; font-size: 12px; color: var(--ink3); }

/* ── 다크 섹션 ─────────────────────────── */
.dark { background: #000; color: #fff; text-align: center; }
.dark .sec__lead, .dark .sec__body { color: #A1A1A6; }
.dark .sec__body strong { color: #fff; }

.benefit__tag { font-size: 13px; font-weight: 700; color: var(--cta); margin-bottom: 16px; }
.bignum { font-size: 72px; font-weight: 900; line-height: .95; letter-spacing: -0.05em; }
.bignum em { font-size: 32px; font-style: normal; color: #86868B; }
.bignum.accent, .bignum.accent em { color: var(--cta); }
.benefit { padding: 34px 0; }
.benefit__desc { margin-top: 12px; font-size: 16px; font-weight: 500; }
.benefit__sub { margin-top: 8px; font-size: 13px; color: #86868B; }
.rule { border: 0; border-top: 1px solid #333336; margin: 0; }

/* ── 지표 ─────────────────────────────── */
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 30px; }
.stats li { padding: 22px 16px; background: var(--card); border-radius: var(--r-md); }
.stats b { display: block; font-size: 26px; font-weight: 900; letter-spacing: -0.04em; }
.stats em { font-size: 16px; font-style: normal; }
.stats span { display: block; margin-top: 8px; font-size: 12px; line-height: 1.5; color: var(--ink2); }

/* ── 이용 방법 ─────────────────────────── */
.steps { display: flex; flex-direction: column; gap: 12px; margin-top: 34px; text-align: left; }
.steps li { display: flex; gap: 16px; padding: 24px 20px; background: #1D1D1F; border-radius: 18px; }
.steps__n {
  display: flex; align-items: center; justify-content: center;
  width: 32px; height: 32px; flex-shrink: 0;
  background: #fff; color: #000; border-radius: 50%;
  font-size: 15px; font-weight: 900;
}
.steps h3 { font-size: 17px; font-weight: 700; }
.steps p { margin-top: 8px; font-size: 14px; line-height: 1.68; color: #A1A1A6; }

/* ── CTA ──────────────────────────────── */
.cta { text-align: center; }
.cta .btn { margin-top: 12px; }
.cta .btn--primary { display: flex; }
.cta .btn--ghost { display: flex; }

/* ── 유의사항 ─────────────────────────── */
.notice { background: var(--card); padding: 44px 0 52px; }
.notice__head {
  font-size: 15px; font-weight: 700; color: var(--cta);
  text-align: center; margin-bottom: 32px;
}
/* 유의사항은 모바일에서 접어둔다. 펼쳐두면 1100px 이상을 차지해
   푸터까지 도달하는 스크롤이 크게 늘어난다. */
.acc {
  background: #fff; border-radius: var(--r-sm);
  margin-bottom: 8px; overflow: hidden;
}
.acc > summary {
  display: flex; align-items: center; justify-content: space-between;
  gap: 10px; min-height: 52px; padding: 14px 16px;
  font-size: 15px; font-weight: 700; color: var(--ink);
  cursor: pointer; list-style: none;
  -webkit-tap-highlight-color: transparent;
}
.acc > summary::-webkit-details-marker { display: none; }
.acc > summary::after {
  content: ""; flex-shrink: 0;
  width: 9px; height: 9px; margin-right: 4px;
  border-right: 2px solid var(--ink3); border-bottom: 2px solid var(--ink3);
  transform: rotate(45deg) translateY(-2px);
  transition: transform .18s ease;
}
.acc[open] > summary::after { transform: rotate(-135deg) translateY(-2px); }
.acc > ul { padding: 0 16px 16px; }

.notice ul { display: flex; flex-direction: column; gap: 9px; }
.notice li {
  position: relative; padding-left: 12px;
  font-size: 13px; line-height: 1.72; color: var(--ink2);
}
.notice li::before { content: "·"; position: absolute; left: 2px; }
.notice strong { color: var(--ink); font-weight: 700; }

/* ── 푸터 ─────────────────────────────── */
.footer { padding: 48px 0 56px; text-align: center; }
.footer .lockup { margin-top: 0; }
.footer__copy { margin-top: 24px; font-size: 14px; line-height: 1.72; color: var(--ink3); }
.footer__slogan { margin-top: 26px; font-size: 14px; font-weight: 700; }

/* ── 모바일 고정 CTA 바 ─────────────────── */
/* 페이지가 7~8화면이라 하단 CTA가 멀다. 주요 행동을 항상 손 닿는 곳에 둔다. */
.mbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
  display: flex; gap: 8px;
  padding: 10px 16px;
  padding-bottom: calc(10px + env(safe-area-inset-bottom));  /* 아이폰 홈바 */
  background: rgba(255,255,255,.94);
  backdrop-filter: saturate(180%) blur(12px);
  -webkit-backdrop-filter: saturate(180%) blur(12px);
  border-top: 1px solid var(--line);
}
.mbar a {
  display: flex; align-items: center; justify-content: center;
  min-height: 50px; border-radius: 999px;
  font-size: 16px; font-weight: 700; letter-spacing: -0.02em;
  -webkit-tap-highlight-color: transparent;
}
.mbar__ghost { flex: 0 0 38%; background: var(--card); color: var(--ink); }
.mbar__cta   { flex: 1 1 auto; background: var(--cta); color: #fff; }
.mbar__cta:hover { color: #fff; }

/* 고정 바에 콘텐츠가 가리지 않도록 문서 하단 여백 확보 */
body { padding-bottom: calc(72px + env(safe-area-inset-bottom)); }

@media (min-width: 880px) {
  .mbar { display: none; }
  body { padding-bottom: 0; }
}

/* ── 데스크톱 ─────────────────────────── */
@media (min-width: 880px) {
  .wrap { max-width: 980px; }

/* ===== app-webview.css ===== */
/* 웹뷰 전용 레이아웃 오버라이드 — style.css 뒤에 로드한다 */

/*
  원본(index.html)은 히어로·혜택·이용방법·CTA·유의사항을 갖춘 랜딩페이지다.
  웹뷰는 앱 안에 들어가므로 앱 헤더/네비가 이미 있고, 마케팅 문구도 앱의 다른
  화면이 담당한다. 그래서 여기서는 지도와 지점 찾기만 남기고,
  페이지 스크롤 대신 리스트만 스크롤하는 앱 화면형 구조로 바꾼다.

  style.css의 컴포넌트(버튼·칩·리스트 행·추천 카드·배지)는 그대로 재사용한다.
*/

html, body { height: 100%; }

body.webview {
  /* 원본의 하단 고정 CTA 바 여백이 필요 없다 */
  padding-bottom: 0;
  background: #fff;
  /* 헤더가 있으므로 문서 스크롤을 허용한다. 대신 지도는 sticky로 붙여
     리스트를 훑는 동안에도 계속 보이게 한다. */
  overscroll-behavior-y: none;   /* 스크롤 끝에서 앱 화면이 당겨지는 것 방지 */
  /* 노치/상태바 영역을 침범하지 않는다 */
  padding-top: env(safe-area-inset-top);
}

/* ── 헤더 ─────────────────────────────────────── */
.wv-controls .eyebrow { margin-bottom: 8px; }
.wv-controls .sec__title { font-size: 26px; }
.wv-controls .sec__lead { margin-top: 10px; font-size: 14px; margin-bottom: 20px; }

/* 지도와 리스트를 감싸는 래퍼. sticky는 부모 박스 안에서만 유지되므로
   이 둘이 같은 부모를 가져야 리스트를 훑는 동안 지도가 계속 붙어 있는다. */
.wv-body { position: relative; }

/* ── 지도: 헤더 아래, 스크롤 시 상단에 고정 ────── */
.wv-map-wrap {
  position: sticky; top: 0; z-index: 3;
  background: #fff;
  box-shadow: 0 6px 16px -12px rgba(0,0,0,.35);
}
body.webview .map {
  height: 42vh;
  height: 42svh;
  min-height: 240px;
  max-height: 380px;
  /* touch-action은 style.css에서 none으로 지정 — 한 손가락 드래그가 지도 이동 */
}
body.webview .legend {
  border-bottom: 1px solid var(--line);
}
body.webview .legend::after { display: none; }   /* 고정 스크롤 페이드 불필요 */

/* ── 검색 · 필터 · 추천 ───────────────────────── */
.wv-controls {
  padding: 24px 16px 14px;
}
/* 내 위치 버튼 + 검색창을 한 줄에. min-width:0 이 없으면 검색창이
   콘텐츠 최소폭을 고집해 좁은 화면에서 가로로 넘친다. */
.wv-controls .origin-bar {
  margin-top: 0; flex-direction: row; gap: 8px;
  align-items: stretch; min-width: 0;
}
.wv-controls .btn--locate {
  width: auto; flex: 0 0 auto;
  padding: 0 14px; font-size: 15px; white-space: nowrap;
}
.wv-controls .search { flex: 1 1 auto; min-width: 0; }
.wv-controls .search input { min-width: 0; }

/* 화면이 아주 좁으면 아이콘만 남긴다 */
@media (max-width: 380px) {
  .wv-controls .btn--locate { padding: 0 12px; }
  .wv-controls .btn--locate .wv-label { display: none; }
}
.wv-controls .chips {
  margin-top: 12px; margin-bottom: 0;
  margin-left: -16px; margin-right: -16px;
  padding-left: 16px; padding-right: 16px;
}
.wv-controls .status { margin-top: 10px; }
.wv-controls .recommend { margin-top: 12px; }

/* 웹뷰에서는 화면이 좁으니 추천 카드를 한 단 더 압축한다 */
body.webview .recommend { padding: 16px 16px 14px; border-radius: 16px; }
body.webview .recommend__name { font-size: 18px; margin-top: 6px; }
body.webview .recommend__meta { font-size: 12px; margin-top: 6px; }
body.webview .recommend__dist { margin-top: 10px; font-size: 14px; }
body.webview .recommend__dist b { font-size: 22px; }
body.webview .recommend__note { display: none; }  /* 하단 note로 통합 */
body.webview .recommend__acts { margin-top: 12px; }

/* ── 리스트: 남은 공간을 채우고 이 영역만 스크롤 ── */
.wv-list {
  padding: 0 16px calc(24px + env(safe-area-inset-bottom));
}
.wv-list .list-head { padding: 16px 0 12px; }
body.webview .note { margin: 14px 0 4px; font-size: 11px; line-height: 1.6; }

/* ── 가로 모드 / 낮은 화면: 지도와 리스트를 좌우로 ── */
@media (min-width: 720px) and (max-height: 560px) {
  body.webview {
    display: grid;
    grid-template-columns: 1fr 380px;
    grid-template-areas: "map controls" "map list";
    grid-template-rows: auto 1fr;
    height: 100%;
    overflow: hidden;
  }
  .wv-body { display: contents; }   /* 그리드 자식이 map/list가 되도록 */
  .wv-map-wrap { grid-area: map; position: relative; height: 100%; overflow: hidden; }
  body.webview .map { height: 100%; max-height: none; min-height: 0; }
  .wv-controls {
    grid-area: controls; border-left: 1px solid var(--line);
    padding: 16px 16px 12px;
  }
  .wv-controls .sec__title { font-size: 20px; }
  .wv-controls .sec__lead { display: none; }   /* 좁은 높이에선 설명문 생략 */
  .wv-list {
    grid-area: list; border-left: 1px solid var(--line);
    min-height: 0; overflow-y: auto;
    -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
  }
  body.webview .legend {
    position: absolute; left: 12px; bottom: 12px; z-index: 5;
    border: 1px solid var(--line); border-radius: 10px;
    background: rgba(255,255,255,.95); padding: 8px 12px;
  }
}

/* ===== geo.js ===== */

// IUGG 평균 지구반경. 분석 프로젝트 scripts/haversine.py와 동일한 값을 쓴다.
// 두 구현이 같은 상수를 쓰지 않으면 리포트 수치와 웹 수치가 미세하게 달라진다.
var R_KM = 6371.0088;

/**
 * 두 좌표 간 대원거리(km). scripts/haversine.py의 이식본.
 * a를 [0,1]로 클립하는 것까지 동일 — 부동소수 오차로 sqrt(1-a)가 NaN이 되는 것을 막는다.
 */
function haversineKm(lat1, lng1, lat2, lng2) {
  var rad = function (d) { return d * Math.PI / 180; };
  var p1 = rad(lat1), p2 = rad(lat2);
  var dp = p2 - p1;
  var dl = rad(lng2) - rad(lng1);
  var a = Math.sin(dp / 2) * Math.sin(dp / 2)
        + Math.cos(p1) * Math.cos(p2) * Math.sin(dl / 2) * Math.sin(dl / 2);
  a = Math.min(1, Math.max(0, a));
  return R_KM * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

 * 거리 표기. 구간별로 단위와 자릿수를 바꾼다.
 *   1km 미만  -> "400m"  (10m 단위. "0.4km"보다 읽기 쉽다)
 *   1~10km    -> "3.2km" (소수 1자리)
 *   10km 이상 -> "127km" (정수. "127.3km"는 직선거리에 대한 허위정밀도)
 */
function formatDistance(km) {
  if (km == null || isNaN(km)) return '';
  if (km < 1) return Math.round(km * 100) * 10 + 'm';
  // 9.96처럼 반올림하면 10.0이 되는 값은 소수 표기를 버리고 정수 구간으로 넘긴다.
  // ("10.0km"는 소수 자리가 의미 없고, 아래 정수 표기와 규칙이 어긋난다)
  if (km < 10 && Number(km.toFixed(1)) < 10) return km.toFixed(1) + 'km';
  return Math.round(km) + 'km';
}

// ── 카카오맵 URL 스킴 ────────────────────────────────────────────────
// 형식: 이름,위도,경도 (이름이 먼저, 쉼표 구분, 경로에 들어감)
// 지점명에 공백이 있어(예: "오토스테이 자유로88") encodeURIComponent가 필수다.
// 웹 URL을 쓰면 모바일에서 앱이 있으면 앱으로, 없으면 웹으로 열린다.
// kakaomap:// 커스텀 스킴은 데스크톱에서 막히므로 쓰지 않는다.

function kakaoRouteUrl(store, origin) {
  var to = encodeURIComponent(store.name) + ',' + store.lat + ',' + store.lng;
  if (origin && origin.lat != null && origin.lng != null) {
    var from = encodeURIComponent(origin.label || '내 위치') + ',' + origin.lat + ',' + origin.lng;
    return 'https://map.kakao.com/link/from/' + from + '/to/' + to;
  }
  return 'https://map.kakao.com/link/to/' + to;
}

function kakaoPlaceUrl(store) {
  return 'https://map.kakao.com/link/map/'
       + encodeURIComponent(store.name) + ',' + store.lat + ',' + store.lng;
}

/* ===== app.js ===== */
// 지점 찾기 앱 — 상태 모델 · 렌더링 · 카카오 지도 · 내 위치 · 장소 검색

(function () {
  'use strict';

  // ── 상태 ─────────────────────────────────────────────
  // 단일 상태 객체 + render()로 통일한다. DOM을 직접 만지면
  // 리스트와 지도가 서로 다른 것을 가리키는 버그가 생긴다.
  var state = {
    origin: null,      // { lat, lng, label } — 내 위치 또는 검색 장소
    group: 'all',      // 지역 필터
    selectedId: null,  // 선택된 지점 id
    sorted: []         // STORES + distKm, 정렬 완료
  };

  var GROUPS = [
    { key: 'all',    label: '전체' },
    { key: 'goyang', label: '고양·파주' },
    { key: 'seoul',  label: '서울·광명' },
    { key: 'north',  label: '양주·하남' },
    { key: 'south',  label: '경기 남부' },
    { key: 'daegu',  label: '대구·구미' }
  ];

  // 카카오 객체 (지도 없이도 앱이 동작해야 하므로 전부 null 허용)
  var map = null, overlay = null, myMarker = null;
  var markers = {};   // id -> kakao.maps.Marker
  var rowEls = {};    // id -> HTMLElement
  var PIN = null;
  var mapReady = false;

  var $ = function (id) { return document.getElementById(id); };
  var el = {};

  // ── 유틸 ─────────────────────────────────────────────
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function badgeClass(type) { return type === '직영' ? 'badge--direct' : 'badge--fr'; }

  // 리스트용 짧은 이름. 모든 행이 "오토스테이"로 시작하므로 접두어는 잡음이다.
  function shortName(name) { return name.replace(/^오토스테이\s*/, ''); }

  function setStatus(msg, kind) {
    el.status.textContent = msg || '';
    el.status.className = 'status' + (msg ? ' is-' + (kind || 'ok') : '');
  }

  // ── 정렬 · 필터 ───────────────────────────────────────
  function recompute() {
    var o = state.origin;
    state.sorted = STORES.map(function (s) {
      var copy = {};
      for (var k in s) copy[k] = s[k];
      copy.distKm = o ? haversineKm(o.lat, o.lng, s.lat, s.lng) : null;
      return copy;
    });

    state.sorted.sort(function (a, b) {
      if (o) return a.distKm - b.distKm;
      // 기준점이 없으면 수도권 우선 → 지역명 → no
      if (a.zone !== b.zone) return a.zone === '수도권' ? -1 : 1;
      if (a.region !== b.region) return a.region.localeCompare(b.region, 'ko');
      return a.no - b.no;
    });
  }

  function visibleStores() {
    if (state.group === 'all') return state.sorted;
    return state.sorted.filter(function (s) { return s.group === state.group; });
  }

  function isVisible(store) {
    return state.group === 'all' || store.group === state.group;
  }

  // ── 렌더 ─────────────────────────────────────────────
  function render() {
    recompute();
    renderRecommend();
    renderChips();
    renderList();
    syncMarkers();
    syncUrl();
  }

  // 추천 카드는 필터를 무시하고 항상 "전체 중 가장 가까운" 지점을 보여준다.
  // 고양에 있는 사용자가 대구 필터를 눌렀을 때 추천이 대구로 바뀌면 의미가 없다.
  function renderRecommend() {
    if (!state.origin) { el.recommend.hidden = true; el.recommend.innerHTML = ''; return; }
    var top = state.sorted[0];
    if (!top) { el.recommend.hidden = true; return; }

    el.recommend.hidden = false;
    el.recommend.innerHTML =
      '<p class="recommend__tag">' + esc(state.origin.label) + ' 기준 · 가장 가까운 지점</p>' +
      '<p class="recommend__name">' + esc(top.name) + '</p>' +
      '<p class="recommend__meta">' + esc(top.addr) + '<br>' + esc(top.hours) +
        ' · <span class="badge ' + badgeClass(top.type) + '">' + esc(top.type) + '</span></p>' +
      '<p class="recommend__dist">직선거리 <b>' + formatDistance(top.distKm) + '</b></p>' +
      '<p class="recommend__note">직선거리 기준이며 실제 이동거리·소요시간과 다를 수 있습니다.</p>' +
      '<div class="recommend__acts">' +
        '<a class="btn btn--primary" href="' + kakaoRouteUrl(top, state.origin) +
          '" target="_blank" rel="noopener">길찾기</a>' +
        '<button type="button" class="btn btn--ghost" data-focus="' + top.id + '">지도에서 보기</button>' +
      '</div>';
  }

  function renderChips() {
    if (el.chips.childElementCount) {   // 1회만 생성하고 이후 상태만 갱신
      Array.prototype.forEach.call(el.chips.children, function (b) {
        b.setAttribute('aria-selected', String(b.dataset.group === state.group));
      });
      return;
    }
    GROUPS.forEach(function (g) {
      var b = document.createElement('button');
      b.type = 'button';
      b.setAttribute('role', 'tab');
      b.dataset.group = g.key;
      b.textContent = g.label;
      b.setAttribute('aria-selected', String(g.key === state.group));
      el.chips.appendChild(b);
    });
  }

  function renderList() {
    var list = visibleStores();
    var gLabel = GROUPS.filter(function (g) { return g.key === state.group; })[0].label;

    el.listTitle.textContent = state.group === 'all'
      ? '참여 지점 ' + list.length + '곳'
      : gLabel + ' ' + list.length + '곳';

    rowEls = {};
    el.list.innerHTML = '';

    if (!list.length) {
      var p = document.createElement('li');
      p.className = 'empty';
      p.textContent = '선택한 지역에 참여 지점이 없습니다.\n다른 지역을 선택해 주세요.';
      el.list.appendChild(p);
      return;
    }

    list.forEach(function (s) {
      var li = document.createElement('li');
      var dist = s.distKm != null
        ? '<span class="badge badge--dist">' + formatDistance(s.distKm) + '</span>' : '';

      li.innerHTML =
        '<button type="button" class="store-item' +
          (s.id === state.selectedId ? ' is-selected' : '') + '" data-id="' + s.id + '">' +
          '<span class="store-item__top">' +
            '<span class="store-item__name">' + esc(shortName(s.name)) + '</span>' +
            '<span class="badge ' + badgeClass(s.type) + '">' + esc(s.type) + '</span>' +
            dist +
          '</span>' +
          '<span class="store-item__addr">' + esc(s.addr) +
            '<br><span class="hours">' + esc(s.hours) + '</span></span>' +
          '<span class="store-item__foot">' +
            '<span class="store-item__link" data-route="' + s.id + '">길찾기</span>' +
          '</span>' +
        '</button>';

      el.list.appendChild(li);
      rowEls[s.id] = li.firstChild;
    });
  }

  // ?store=id 를 유지해 특정 지점 딥링크 공유가 가능하게 한다
  function syncUrl() {
    if (!window.history || !history.replaceState) return;
    var u = new URL(location.href);
    if (state.selectedId) u.searchParams.set('store', state.selectedId);
    else u.searchParams.delete('store');
    history.replaceState(null, '', u.toString());
  }

  // ── 선택 ─────────────────────────────────────────────
  function select(id, opts) {
    opts = opts || {};
    state.selectedId = id;

    var store = null;
    for (var i = 0; i < STORES.length; i++) if (STORES[i].id === id) store = STORES[i];

    // 선택한 지점이 현재 필터 밖이면 필터를 전체로 되돌린다 (핀은 숨었는데 선택된 상태 방지)
    if (store && !isVisible(store)) state.group = 'all';

    render();

    if (store && opts.pan && mapReady) {
      // setLevel(anchor) + panTo를 같이 부르면 애니메이션 pan이 확대를 가로채
      // 배율은 그대로인 채 위치만 어긋난다. 중심과 레벨을 한 번에 확정한다.
      var pos = new kakao.maps.LatLng(store.lat, store.lng);
      map.setLevel(MAP_FOCUS_LEVEL);
      map.setCenter(pos);
      // 지도 컨테이너 상단이 화면 밖으로 밀려 있으면 컨테이너 중앙 = 화면 밖이 된다.
      // 잘려나간 만큼 지도를 되돌려 핀이 보이는 영역 가운데 오게 한다.
      var box = el.map.getBoundingClientRect();
      var hidden = Math.max(0, -box.top);
      if (hidden > 8) {
        var pt = map.getProjection().containerPointFromCoords(pos);
        pt.y += hidden / 2;
        map.setCenter(map.getProjection().coordsFromContainerPoint(pt));
      }
    }
    if (opts.scroll !== false) {
      // render()가 리스트를 새로 만들었으므로 다음 프레임에 측정한다.
      // 즉시 측정하면 교체 전 노드의 좌표를 읽어 스크롤이 어긋난다.
      var rid = id;
      requestAnimationFrame(function () {
        var row = rowEls[rid];
        if (row) revealRow(row);
      });
    }
  }

  // 고정된 지도(.map-col) 높이만큼 오프셋을 두고 행을 노출한다.
  // scrollIntoView는 sticky 요소를 모르기 때문에 그냥 쓰면 행이 지도 아래에 가린다.
  function revealRow(row) {
    var r = row.getBoundingClientRect();
    var col = document.querySelector('.map-col');
    var stuck = col ? col.getBoundingClientRect() : null;
    var top = stuck && stuck.top <= 1 ? stuck.bottom : 0;   // 지도가 붙어 있을 때만 보정
    var gap = 12;
    if (r.top < top + gap) {
      window.scrollBy({ top: r.top - top - gap, behavior: 'smooth' });
    } else if (r.bottom > window.innerHeight - 84) {         // 하단 고정 CTA 바 여유
      window.scrollBy({ top: r.bottom - window.innerHeight + 84, behavior: 'smooth' });
    }
  }

  // ── 지도 ─────────────────────────────────────────────
  function showMapError(code) {
    var msgs = {
      NO_KEY: '지도 준비 중입니다.\n지점 목록은 아래에서 확인하실 수 있습니다.',
      SDK_FAILED: '지도를 불러올 수 없습니다.\n지점 목록은 아래에서 확인하실 수 있습니다.',
      NO_SERVICES: '지도 검색 기능을 불러올 수 없습니다.',
      TIMEOUT: '지도 로딩이 지연되고 있습니다.\n네트워크를 확인해 주세요.'
    };
    el.map.innerHTML = '<div class="map-fallback"><p>' +
      esc(msgs[code] || '지도 오류') + '</p></div>';
    document.body.classList.add('no-map');
    // 지도가 없어도 내 위치·검색·정렬은 그대로 동작한다 (검색만 SDK 의존)
    if (code === 'NO_KEY' || code === 'SDK_FAILED' || code === 'TIMEOUT') {
      el.q.disabled = true;
      el.q.placeholder = '지도 준비 후 검색 가능';
    }
  }

  function loadKakaoSdk() {
    return new Promise(function (resolve, reject) {
      if (!KAKAO_JS_KEY || KAKAO_JS_KEY.indexOf('PASTE_') === 0) return reject('NO_KEY');
      var done = false;
      var t = setTimeout(function () { if (!done) reject('TIMEOUT'); }, 10000);
      var s = document.createElement('script');
      s.async = true;
      s.src = 'https://dapi.kakao.com/v2/maps/sdk.js?appkey=' + encodeURIComponent(KAKAO_JS_KEY) +
              '&libraries=services&autoload=false';
      s.onerror = function () { done = true; clearTimeout(t); reject('SDK_FAILED'); };
      s.onload = function () {
        if (!window.kakao || !kakao.maps) { done = true; clearTimeout(t); return reject('SDK_FAILED'); }
        kakao.maps.load(function () {
          done = true; clearTimeout(t);
          if (!kakao.maps.services) return reject('NO_SERVICES');
          resolve();
        });
      };
      document.head.appendChild(s);
    });
  }

  function initMap() {
    map = new kakao.maps.Map(el.map, {
      center: new kakao.maps.LatLng(37.5665, 126.9780),
      level: MAP_DEFAULT_LEVEL
    });

    map.setMaxLevel(MAP_MAX_LEVEL);
    map.addControl(new kakao.maps.ZoomControl(), kakao.maps.ControlPosition.RIGHT);

        new kakao.maps.Size(34, 44), { offset: new kakao.maps.Point(17, 44) }),
      '가맹': new kakao.maps.MarkerImage('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzNCIgaGVpZ2h0PSI0NCIgdmlld0JveD0iMCAwIDM0IDQ0Ij4KICA8cGF0aCBkPSJNMTcgMEM3LjYxMSAwIDAgNy42MTEgMCAxN2MwIDExLjA1IDE0LjAzIDI0LjI5IDE2LjAyIDI2LjEzYTEuNDQgMS40NCAwIDAgMCAxLjk2IDBDMTkuOTcgNDEuMjkgMzQgMjguMDUgMzQgMTcgMzQgNy42MTEgMjYuMzg5IDAgMTcgMHoiIGZpbGw9IiMwMDY2Q0MiLz4KICA8Y2lyY2xlIGN4PSIxNyIgY3k9IjE2LjUiIHI9IjYuMiIgZmlsbD0iI0ZGRkZGRiIvPgo8L3N2Zz4=',
        new kakao.maps.Size(34, 44), { offset: new kakao.maps.Point(17, 44) }),
      selected: new kakao.maps.MarkerImage('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI0NiIgaGVpZ2h0PSI1OCIgdmlld0JveD0iMCAwIDQ2IDU4Ij4KICA8cGF0aCBkPSJNMjMgMEMxMC4yOTcgMCAwIDEwLjI5NyAwIDIzYzAgMTQuOTUgMTguOTggMzIuODYgMjEuNjcgMzUuMzVhMS45NSAxLjk1IDAgMCAwIDIuNjYgMEMyNy4wMiA1NS44NiA0NiAzNy45NSA0NiAyMyA0NiAxMC4yOTcgMzUuNzAzIDAgMjMgMHoiIGZpbGw9IiMxRDFEMUYiLz4KICA8Y2lyY2xlIGN4PSIyMyIgY3k9IjIyLjQiIHI9IjkuNiIgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjRkZGRkZGIiBzdHJva2Utd2lkdGg9IjIuNiIvPgogIDxjaXJjbGUgY3g9IjIzIiBjeT0iMjIuNCIgcj0iNCIgZmlsbD0iI0ZGRkZGRiIvPgo8L3N2Zz4=',
        new kakao.maps.Size(46, 58), { offset: new kakao.maps.Point(23, 58) })
    };

    // 오버레이는 인스턴스 1개를 재사용한다 (15개 생성 금지)
    overlay = new kakao.maps.CustomOverlay({ yAnchor: 1.62, zIndex: 20 });

    STORES.forEach(function (s) {
      var mk = new kakao.maps.Marker({
        position: new kakao.maps.LatLng(s.lat, s.lng),
        image: PIN[s.type],
        title: s.name
      });
      kakao.maps.event.addListener(mk, 'click', function () {
        // 마커 클릭 시엔 지도를 움직이지 않는다 (손가락 아래에서 화면이 움직이면 혼란)

    mapReady = true;
    fitTo(visibleStores());

    var t;
    function relayout() {
      clearTimeout(t);
      t = setTimeout(function () {
        map.relayout();
        fitTo(visibleStores());
      }, 150);
    }
    window.addEventListener('resize', relayout);
    window.addEventListener('orientationchange', relayout);

    // 지도가 화면 밖(스크롤 아래)에 있으면 카카오가 컨테이너 크기를 0으로 보고
    // setBounds가 조용히 실패한다. 처음 화면에 들어오는 순간 relayout + 재fit 한다.
    // (실제로 이 처리가 없으면 지도가 세계지도 좌상단을 보여준다)
    if (window.IntersectionObserver) {
      var io = new IntersectionObserver(function (entries) {
        for (var i = 0; i < entries.length; i++) {
          if (entries[i].isIntersecting) {
            map.relayout();
            fitTo(visibleStores());
            io.disconnect();
            break;
          }
        }
      }, { threshold: 0.01 });
      io.observe(el.map);
    }
  }

  function fitTo(list) {
    if (!mapReady || !list.length) return;
    var b = new kakao.maps.LatLngBounds();
    list.forEach(function (s) { b.extend(new kakao.maps.LatLng(s.lat, s.lng)); });
    if (state.origin) b.extend(new kakao.maps.LatLng(state.origin.lat, state.origin.lng));
    // 패딩이 없으면 외곽 핀이 뷰포트 경계에 붙는다
    map.setBounds(b, 48, 48, 48, 48);
    // setBounds는 setMaxLevel을 무시하고 더 축소할 수 있다(좁은 화면에서 전 지점을
    // 담으려 할 때). 상한을 넘으면 되돌린다.
    if (map.getLevel() > MAP_MAX_LEVEL) map.setLevel(MAP_MAX_LEVEL);
  }

  function syncMarkers() {
    if (!mapReady) return;
    STORES.forEach(function (s) {
      var mk = markers[s.id];
      var vis = isVisible(s);
      mk.setMap(vis ? map : null);
      mk.setImage(s.id === state.selectedId ? PIN.selected : PIN[s.type]);
      mk.setZIndex(s.id === state.selectedId ? 30 : 10);
    });

    var sel = null;
    for (var i = 0; i < STORES.length; i++) if (STORES[i].id === state.selectedId) sel = STORES[i];

    // 마커를 숨겨도 CustomOverlay는 남는다 → 명시적으로 닫는다
    if (sel && isVisible(sel)) {
      var d = state.sorted.filter(function (x) { return x.id === sel.id; })[0];
      var dist = d && d.distKm != null ? ' · 직선거리 ' + formatDistance(d.distKm) : '';
      overlay.setContent(
        '<div style="padding:10px 14px;background:#1D1D1F;color:#fff;border-radius:12px;' +
        'font:700 13px/1.4 \'Noto Sans KR\',sans-serif;letter-spacing:-.02em;white-space:nowrap;' +
        'box-shadow:0 4px 14px rgba(0,0,0,.25)">' + esc(sel.name) +
        '<span style="display:block;margin-top:3px;font-weight:400;font-size:11px;color:#A1A1A6">' +
        esc(sel.hours) + dist + '</span></div>'
      );
      overlay.setPosition(new kakao.maps.LatLng(sel.lat, sel.lng));
      overlay.setMap(map);
    } else {
      overlay.setMap(null);
    }
  }

  function showMyLocation() {
    if (!mapReady || !state.origin) return;
    var pos = new kakao.maps.LatLng(state.origin.lat, state.origin.lng);
    if (!myMarker) {
      myMarker = new kakao.maps.CustomOverlay({
        position: pos, zIndex: 25, yAnchor: 0.5, xAnchor: 0.5,
        content: '<div style="width:16px;height:16px;border-radius:50%;background:#0071E3;' +
                 'border:3px solid #fff;box-shadow:0 0 0 6px rgba(0,113,227,.25)"></div>'
      });
    }
    myMarker.setPosition(pos);
    myMarker.setMap(map);
  }

  // ── 기준점 설정 ───────────────────────────────────────
  function setOrigin(lat, lng, label) {
    state.origin = { lat: lat, lng: lng, label: label };
    state.selectedId = null;
    clearCandidates();
    render();
    showMyLocation();
    fitTo(visibleStores());
    setStatus(label + ' 기준으로 가까운 지점을 정렬했습니다.', 'ok');
  }

  // ── 내 위치 ───────────────────────────────────────────
  function locate() {
    if (!navigator.geolocation) {
      setStatus('이 브라우저는 위치 기능을 지원하지 않습니다. 지역명으로 검색해 주세요.', 'err');
      return;
    }
    var btn = el.locate, label = btn.innerHTML;
    btn.disabled = true;
    btn.textContent = '위치 확인 중...';
    setStatus('');

    function restore() { btn.disabled = false; btn.innerHTML = label; }

    navigator.geolocation.getCurrentPosition(
      function (pos) {
        restore();
        setOrigin(pos.coords.latitude, pos.coords.longitude, '현재 위치');
      },
      function (err) {
        restore();
        // 위치 거부는 사이트별로 기억되어 재요청이 안 된다 → 검색으로 유도한다
        var m = {
          1: '내 위치가 보이지 않을 경우, 브라우저 설정 > 위치를 허용해 주세요.\n또는 아래 검색창에 지역명을 입력해 주세요.',
          2: '위치를 확인할 수 없습니다. 지역명으로 검색해 주세요.',
          3: '위치 확인이 지연됩니다. 지역명으로 검색해 주세요.'
        };
        setStatus(m[err.code] || '위치 확인에 실패했습니다. 지역명으로 검색해 주세요.', 'err');
        if (!el.q.disabled) el.q.focus();
      },
      { enableHighAccuracy: true, timeout: 8000, maximumAge: 300000 }
    );
  }

  // ── 장소 검색 ─────────────────────────────────────────
  function clearCandidates() {
    el.candidates.hidden = true;
    el.candidates.innerHTML = '';
  }

  function showCandidates(items, q) {
    if (items.length === 1) {   // 결과가 하나면 바로 적용
      setOrigin(items[0].lat, items[0].lng, items[0].label);
      return;
    }
    // 여러 결과를 조용히 하나로 골라버리면 엉뚱한 지점을 추천하게 된다 → 사용자가 고른다
    el.candidates.innerHTML = '';
    items.slice(0, SEARCH_MAX_RESULTS).forEach(function (it) {
      var li = document.createElement('li');
      var b = document.createElement('button');
      b.type = 'button';
      b.innerHTML = '<b>' + esc(it.label) + '</b><span>' + esc(it.sub || '') + '</span>';
      b.addEventListener('click', function () { setOrigin(it.lat, it.lng, it.label); });
      li.appendChild(b);
      el.candidates.appendChild(li);
    });
    el.candidates.hidden = false;
    setStatus('\'' + q + '\' 검색 결과입니다. 기준이 될 장소를 선택해 주세요.', 'ok');
  }

  function search(q) {
    q = (q || '').trim();
    if (!q) return;
    if (!mapReady || !kakao.maps.services) {
      setStatus('검색 기능을 사용할 수 없습니다. 내 위치로 찾기를 이용해 주세요.', 'err');
      return;
    }
    setStatus('검색 중...', 'ok');
    clearCandidates();

    var S = kakao.maps.services.Status;

    // 카카오는 x=경도, y=위도를 문자열로 반환한다. LatLng는 (위도, 경도) 순.
    new kakao.maps.services.Places().keywordSearch(q, function (data, status) {
      if (status === S.OK && data.length) {
        return showCandidates(data.map(function (d) {
          return {
            label: d.place_name,
            sub: d.road_address_name || d.address_name,
            lat: parseFloat(d.y), lng: parseFloat(d.x)
          };
        }), q);
      }
      // 키워드가 0건이면 주소 검색으로 폴백 ("원효로 1가" 같은 입력)
      new kakao.maps.services.Geocoder().addressSearch(q, function (res, st2) {
        if (st2 === S.OK && res.length) {
          return showCandidates(res.map(function (r) {
            return {
              label: r.road_address ? r.road_address.address_name : r.address_name,
              sub: r.address_name,
              lat: parseFloat(r.y), lng: parseFloat(r.x)
            };
          }), q);
        }
        if (st2 === S.ZERO_RESULT) {
          setStatus('검색어와 일치하는 장소가 없습니다.\n지역명이나 도로명 주소로 다시 시도해 주세요.', 'warn');
        } else {
          setStatus('검색 중 오류가 발생했습니다. 잠시 후 다시 시도해 주세요.', 'err');
        }
      });
    }, { size: 10 });
  }

  // ── 이벤트 배선 ───────────────────────────────────────
  function wire() {
    el.locate.addEventListener('click', locate);

    el.form.addEventListener('submit', function (e) {
      e.preventDefault();
      search(el.q.value);
    });

    // 위임: 리스트를 다시 그려도 리스너가 살아 있다
    el.list.addEventListener('click', function (e) {
      var route = e.target.closest('[data-route]');
      if (route) {
        e.preventDefault();
        var rid = route.dataset.route, rs = null;
        for (var i = 0; i < STORES.length; i++) if (STORES[i].id === rid) rs = STORES[i];
        if (rs) window.open(kakaoRouteUrl(rs, state.origin), '_blank', 'noopener');
        return;
      }
      var item = e.target.closest('[data-id]');
      if (item) select(item.dataset.id, { pan: true, scroll: false });
    });

    el.chips.addEventListener('click', function (e) {
      var b = e.target.closest('[data-group]');
      if (!b) return;
      state.group = b.dataset.group;
      var sel = null;
      for (var i = 0; i < STORES.length; i++) if (STORES[i].id === state.selectedId) sel = STORES[i];
      if (sel && !isVisible(sel)) state.selectedId = null;
      render();
      fitTo(visibleStores());
    });

    el.recommend.addEventListener('click', function (e) {
      var f = e.target.closest('[data-focus]');
      if (f) select(f.dataset.focus, { pan: true });
    });

    // 미확정 링크는 클릭을 막고 무엇이 필요한지 알린다
    Array.prototype.forEach.call(document.querySelectorAll('.todo-link'), function (a) {
      a.addEventListener('click', function (e) {
        e.preventDefault();
        alert('아직 연결되지 않은 링크입니다: ' + a.dataset.todo);
      });
    });
  }

  // ── 시작 ─────────────────────────────────────────────
  function start() {
    el = {
      map: $('map'), list: $('list'), listTitle: $('list-title'),
      chips: $('chips'), recommend: $('recommend'), status: $('status'),
      candidates: $('candidates'), locate: $('btn-locate'),
      form: $('search-form'), q: $('q')
    };

    wire();
    render();   // 지도·위치를 기다리지 않고 리스트를 먼저 그린다

    var want = new URL(location.href).searchParams.get('store');

    loadKakaoSdk().then(function () {
      initMap();
      if (want) select(want, { pan: true });
      else render();
    }).catch(function (code) {
      showMapError(typeof code === 'string' ? code : 'SDK_FAILED');
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', start);
  } else {
    start();
  }
})();
</script>
</body>
</html>
